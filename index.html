<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1e3a8a" />
<title>We Do Recover — meeting finder</title>
<link rel="manifest" href="/manifest.json" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Karla',system-ui,sans-serif;background:#f9fafb;color:#1f2937}
  header{background:#1e3a8a;color:#fff;padding:20px;padding-top:calc(20px + env(safe-area-inset-top))}
  header h1{font-size:28px;margin-bottom:4px}
  header p{font-size:13px;color:#dbeafe}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  .controls{position:sticky;top:0;background:#f9fafb;padding:12px 16px;border-bottom:1px solid #e5e7eb;z-index:10}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select{padding:8px;font:inherit;border:1px solid #e5e7eb;border-radius:8px;flex:0 0 auto}
  .seg{display:flex;gap:0;background:#e0e7ff;border-radius:999px;padding:3px;overflow-x:auto;max-width:100%}
  .seg button{border:0;background:0;font:inherit;font-weight:700;font-size:13px;color:#6b7280;padding:6px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}
  .seg button[aria-pressed="true"]{background:#1e3a8a;color:#fff}
  .days,.times{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
  .days button,.times button{border:1px solid #e5e7eb;background:#fff;font:inherit;font-size:13px;font-weight:500;padding:6px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}
  .days button[aria-pressed="true"],.times button[aria-pressed="true"]{background:#1f2937;border-color:#1f2937;color:#fff}
  main{padding:0}
  .state{padding:40px 20px;text-align:center;color:#6b7280;font-size:15px;line-height:1.6}
  .state strong{color:#1f2937}
  .mtg{border:1px solid #e5e7eb;background:#fff;padding:14px;margin:8px 16px;border-radius:12px;cursor:pointer;display:flex;gap:12px}
  .mtg .time{font-size:16px;font-weight:700;min-width:50px}
  .mtg .info strong{display:block;font-family:'Fraunces',serif;font-size:16px;margin-bottom:4px}
  .mtg .info small{font-size:13px;color:#6b7280;display:block;margin-top:4px}
  .skel{height:60px;margin:8px 16px;background:#e5e7eb;border-radius:12px;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end}
  .sheet.hidden{display:none}
  .sheet-content{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
  .sheet-content h2{font-family:'Fraunces',serif;font-size:20px;margin-bottom:16px}
  .sheet-content .close{position:absolute;top:16px;right:16px;border:0;background:#f3f4f6;border-radius:999px;width:34px;height:34px;font-size:20px;cursor:pointer}
  .kv{margin-bottom:16px}
  .kv .k{font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px}
  .kv .v{font-size:15px;line-height:1.5}
  .kv a{color:#1e3a8a;font-weight:700;text-decoration:none}
  footer{padding:20px;text-align:center;font-size:12px;color:#6b7280;line-height:1.6}
  footer a{color:#1e3a8a}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>We Do Recover</h1>
    <p>All pathways welcome · find the next meeting near you</p>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="row">
      <select id="radius">
        <option value="5">5 mi</option>
        <option value="25" selected>25 mi</option>
        <option value="50">50 mi</option>
      </select>
    </div>
    <div class="seg" id="fellowships" role="group"></div>
    <div class="days" id="days" role="group"></div>
    <div class="times" id="times" role="group"></div>
  </div>
</div>

<main id="main"></main>

<footer>
  <strong>NA:</strong> Live from BMLT worldwide · <strong>Other fellowships:</strong> Community submissions only (help us grow!)
  <br><a href="#" id="submit-btn" style="font-weight:700">Submit or update a meeting</a> · Always confirm directly with the source — schedules change.
</footer>

<div class="sheet hidden" id="sheet">
  <div class="sheet-content">
    <button class="close" onclick="closeSheet()">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>

<script>
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const FELLOWSHIPS = {NA:"Narcotics Anonymous", AA:"AA", SMART:"SMART Recovery", RR:"Refuge Recovery", WFS:"WFS", SOS:"SOS", LR:"LifeRing", SR:"She Recovers", CR:"Celebrate"};

const state = {fellowship:"NA", radius:25, day:new Date().getDay(), timeFilter:"all", loc:null, meetings:[], loading:false};

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function renderUI(){
  // Fellowships
  document.getElementById("fellowships").innerHTML = Object.keys(FELLOWSHIPS).map(k => 
    `<button data-f="${k}" aria-pressed="${k===state.fellowship}">${k}</button>`
  ).join("");
  document.getElementById("fellowships").querySelectorAll("button").forEach(b => {
    b.onclick = () => {state.fellowship = b.dataset.f; renderUI(); load()}
  });

  // Days
  const today = new Date().getDay();
  document.getElementById("days").innerHTML = [0,1,2,3,4,5,6].map((i) => {
    const d = (today + i) % 7;
    const label = i===0 ? "Today" : i===1 ? "Tomorrow" : DAYS[d];
    return `<button data-day="${d}" aria-pressed="${d===state.day}">${label}</button>`;
  }).join("");
  document.getElementById("days").querySelectorAll("button").forEach(b => {
    b.onclick = () => {state.day = +b.dataset.day; renderUI(); load()}
  });

  // Times
  document.getElementById("times").innerHTML = [
    ['all','All times'],
    ['morning','Morning'],
    ['afternoon','Afternoon'],
    ['evening','Evening']
  ].map(([v,l]) => `<button data-time="${v}" aria-pressed="${v===state.timeFilter}">${l}</button>`).join("");
  document.getElementById("times").querySelectorAll("button").forEach(b => {
    b.onclick = () => {state.timeFilter = b.dataset.time; renderUI(); render()}
  });

  document.getElementById("radius").onchange = (e) => {state.radius = +e.target.value; load()};
}

async function load(){
  state.loading = true;
  state.meetings = []; // Clear old meetings immediately
  render();
  
  if (!state.loc) return;
  
  try {
    const lat = state.loc.lat.toFixed(2);
    const lng = state.loc.lng.toFixed(2);
    
    if (state.fellowship === "NA") {
      const res = await fetch(`https://aggregator.bmltenabled.org/main_server/client_interface/json/?switcher=GetSearchResults&lat_val=${lat}&long_val=${lng}&geo_width=${state.radius}`);
      const data = await res.json();
      
      if (Array.isArray(data)) {
        state.meetings = data.filter(m => m.latitude && m.longitude && m.meeting_name).map(m => {
          const d = Math.sqrt((m.latitude-lat)**2 + (m.longitude-lng)**2) * 69;
          return {
            name: m.meeting_name, day: (parseInt(m.weekday_tinyint) - 1 + 7) % 7,
            time: (m.start_time || "").slice(0,5), venue: m.location_text,
            city: m.location_municipality, distance: d.toFixed(1)
          };
        });
      }
    } else {
      // Fetch community submissions for this fellowship
      const url = `https://qdxufynzilmqzhortyrq.supabase.co/rest/v1/approved_meetings?fellowship=eq.${state.fellowship}&status=eq.approved`;
      const res = await fetch(url, {
        headers: {
          apikey: "sb_publishable_DH4eF8AYI5K57iS9I3z4bQ_KvR2me39",
          "Content-Type": "application/json"
        }
      });
      if (res.ok) {
        const data = await res.json();
        state.meetings = Array.isArray(data) ? data.filter(m => m.meeting_name && m.day !== null).map(m => ({
          name: m.meeting_name, day: m.day, time: m.time || "", venue: m.venue || "", city: m.city || "", distance: 0, community: true
        })) : [];
      } else {
        state.meetings = [];
      }
    }
  } catch(e) {
    console.error(e);
  }
  
  state.loading = false;
  render();
}

function render(){
  const main = document.getElementById("main");
  
  if (state.loading) {
    main.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    return;
  }
  
  // Add banner for non-NA fellowships
  let banner = '';
  if (state.fellowship !== "NA") {
    banner = `<div style="background:#fef3c7;border-left:4px solid #f59e0b;padding:12px 14px;margin:8px 16px;border-radius:8px;font-size:13px;color:#92400e;line-height:1.5"><strong>Help us grow!</strong> We don't have live data for ${FELLOWSHIPS[state.fellowship]}. <a href="#" id="quick-submit-btn" style="color:#92400e;font-weight:700;text-decoration:underline">Submit meetings</a> in your area.</div>`;
  }
  
  const filtered = state.meetings.filter(m => m.day === state.day && (state.timeFilter==="all" || matchTime(m.time, state.timeFilter)));
  
  if (filtered.length === 0) {
    main.innerHTML = banner + `<div class="state">No meetings found for <strong>${DAYS[state.day]}</strong> within ${state.radius} miles.<br>Try another day or widen the radius.</div>`;
    if (document.getElementById("quick-submit-btn")) {
      document.getElementById("quick-submit-btn").onclick = (e) => { e.preventDefault(); openSubmitSheet(); };
    }
    return;
  }
  
  main.innerHTML = banner + filtered.map(m => `
    <div class="mtg" onclick="openSheet(${JSON.stringify(m).replace(/"/g,'&quot;')})">
      <div class="time">${m.time || "TBA"}</div>
      <div class="info">
        <strong>${esc(m.name)}</strong>
        <small>${esc(m.venue || m.city)}</small>
        ${m.distance > 0 ? `<small>${esc(m.distance)} mi</small>` : ''}
      </div>
    </div>
  `).join("");
  
  if (document.getElementById("quick-submit-btn")) {
    document.getElementById("quick-submit-btn").onclick = (e) => { e.preventDefault(); openSubmitSheet(); };
  }
}

function matchTime(t, filter){
  if(filter==="all")return true;
  const h = parseInt(t.split(":")[0]);
  if(filter==="morning")return h >= 5 && h < 12;
  if(filter==="afternoon")return h >= 12 && h < 17;
  if(filter==="evening")return h >= 17;
  return true;
}

function openSheet(meeting){
  document.getElementById("sheet-body").innerHTML = `
    <h2>${esc(meeting.name)}</h2>
    <div class="kv">
      <div class="k">When</div>
      <div class="v">${DAYS[meeting.day]}s at ${meeting.time || "TBA"}</div>
    </div>
    <div class="kv">
      <div class="k">Where</div>
      <div class="v">${esc(meeting.venue || meeting.city)}</div>
    </div>
  `;
  document.getElementById("sheet").classList.remove("hidden");
}

function closeSheet(){
  document.getElementById("sheet").classList.add("hidden");
}

document.getElementById("sheet").onclick = (e) => {
  if(e.target.id === "sheet") closeSheet();
};

document.getElementById("submit-btn").onclick = (e) => {
  e.preventDefault();
  openSubmitSheet();
};

function openSubmitSheet(){
  document.getElementById("sheet-body").innerHTML = `
    <h2>Submit or Update a Meeting</h2>
    <p style="font-size:13px;color:#6b7280;margin-bottom:16px">Help keep this directory current. All submissions are reviewed and appear within 24 hours.</p>
    <form id="submitForm" style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Type *</label>
        <select name="kind" required style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font:inherit">
          <option value="new">New meeting</option>
          <option value="change">Update to existing meeting</option>
          <option value="remove">Meeting no longer meets</option>
          <option value="temporary">Temporary change (expires)</option>
        </select>
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Fellowship *</label>
        <select name="fellowship" required style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font:inherit">
          <option value="">Choose one...</option>
          ${Object.entries(FELLOWSHIPS).map(([k,v]) => `<option value="${k}" ${k===state.fellowship?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Meeting Name *</label>
        <input type="text" name="meeting_name" required placeholder="e.g., Morning Meditation Group" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font:inherit">
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Venue</label>
        <input type="text" name="venue" placeholder="e.g., Community Center" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font:inherit">
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Address</label>
        <input type="text" name="address" placeholder="e.g., 123 Main St" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font:inherit">
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">City</label>
        <input type="text" name="city" placeholder="e.g., Columbus" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font:inherit">
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Day *</label>
        <select name="day" required style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font:inherit">
          <option value="">Choose a day</option>
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6">Saturday</option>
        </select>
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Time (HH:MM)</label>
        <input type="time" name="time" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font:inherit">
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Online URL</label>
        <input type="url" name="online_url" placeholder="https://..." style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font:inherit">
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Details *</label>
        <textarea name="details" required placeholder="Describe the meeting or what changed" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font:inherit;min-height:60px"></textarea>
      </div>
      <button type="submit" style="background:#1e3a8a;color:#fff;border:0;font-weight:700;padding:12px;border-radius:6px;cursor:pointer;font:inherit">Submit for Review</button>
    </form>
  `;
  document.getElementById("sheet").classList.remove("hidden");
  
  document.getElementById("submitForm").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(document.getElementById("submitForm"));
    const data = Object.fromEntries(fd);
    data.day = parseInt(data.day, 10);
    data.lat = state.loc?.lat;
    data.lng = state.loc?.lng;
    
    try {
      const res = await fetch("https://qdxufynzilmqzhortyrq.supabase.co/rest/v1/submissions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": "sb_publishable_DH4eF8AYI5K57iS9I3z4bQ_KvR2me39"
        },
        body: JSON.stringify(data)
      });
      
      if (res.ok) {
        document.getElementById("sheet-body").innerHTML = `
          <div style="text-align:center;padding:40px 20px">
            <h2 style="font-size:20px;margin-bottom:12px">✓ Thank You</h2>
            <p style="color:#6b7280;margin-bottom:20px">Your submission has been received and will be reviewed within 24 hours.</p>
            <button onclick="closeSheet()" style="background:#1e3a8a;color:#fff;border:0;font-weight:700;padding:10px 20px;border-radius:6px;cursor:pointer">Close</button>
          </div>
        `;
      } else {
        alert("Error submitting. Please try again.");
      }
    } catch (err) {
      alert("Error: " + err.message);
    }
  };
}

function locate(){
  navigator.geolocation.getCurrentPosition(p => {
    state.loc = {lat: p.coords.latitude, lng: p.coords.longitude};
    load();
  }, () => {
    document.getElementById("main").innerHTML = `<div class="state">Please allow location access to find nearby meetings.</div>`;
  });
}

renderUI();
locate();
</script>
</body>
</html>
